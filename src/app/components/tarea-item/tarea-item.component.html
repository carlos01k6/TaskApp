<ion-item-sliding>
  <ion-item class="task-row" lines="none">
    <ion-checkbox
      slot="start"
      [checked]="tarea.completada"
      [attr.aria-label]="tarea.completada ? 'Marcar como pendiente' : 'Marcar como completada'"
      (ionChange)="alternarSolicitado.emit(tarea.id)"
    ></ion-checkbox>
    <ion-label class="task-label">
      <div class="task-heading">
        <h2 [class.completada]="tarea.completada">{{ tarea.titulo }}</h2>
        <ion-badge [color]="obtenerColorPrioridad()">{{ tarea.prioridad }}</ion-badge>
      </div>
      <p class="task-description" [class.completada]="tarea.completada">{{ tarea.descripcion }}</p>
    </ion-label>
    <ion-button
      slot="end"
      fill="clear"
      color="medium"
      class="edit-button"
      aria-label="Editar tarea"
      (click)="editarSolicitado.emit(tarea)"
    >
      <ion-icon slot="icon-only" name="create-outline"></ion-icon>
    </ion-button>
    <ion-button
      slot="end"
      fill="clear"
      color="medium"
      class="delete-button"
      aria-label="Eliminar tarea"
      (click)="solicitarEliminacion()"
    >
      <ion-icon slot="icon-only" name="trash-outline"></ion-icon>
    </ion-button>
  </ion-item>
  <ion-item-options side="end">
    <ion-item-option color="danger" aria-label="Eliminar tarea" (click)="solicitarEliminacion()">
      <ion-icon slot="icon-only" name="trash-outline"></ion-icon>
    </ion-item-option>
  </ion-item-options>
</ion-item-sliding>
